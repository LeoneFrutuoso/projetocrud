<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>CRUD de Tarefas</title>
</head>
<body>

    <h1>CRUD DE TAREFAS</h1>    

    <div class="conteudo">
    <div id="form">
        <div class="container-inputs">
            <label for="input-nome">Nome</label>
            <input id="input-nome" type="text">
        </div>
        <div class="container-inputs">
            <label for="input-idade">Idade</label>
            <input id="input-idade" type="number">
        </div>
        <div class="container-inputs">
            <label for="input-disponibilidade">Disponibilidade</label>
            <input id="input-disponibilidade" type="text">
        </div>
        <div class="container-inputs">
            <label for="input-horario">Horário</label>
            <input id="input-horario" type="text">
        </div>
        <div class="container-inputs">
            <label for="input-restricoes">Restrições</label>
            <input id="input-restricoes" type="text">
        </div>

<div class="container-inputs">
            <label for="input-tarefa">Tarefa</label>
            <input id="input-tarefa" type="text">
        </div>


<div class="container-inputs">
            <label for="input-concluida">Concluída</label>
            <input id="input-concluida" type="checkbox">
    </div>
    <div class="container-inputs" id="div-id">
            <label for="input-input-id">ID</label>
            <input id="input-id" type="number">
        </div>

    <div class="container-botoes-form">
            <button onclick="cadastrarPessoa()">+</button>
            <button onclick="salvarPessoa()">💾</button>
            <button onclick="excluirPessoa()">🗑️</button>
        </div>
    </div>

<div id="mural">
  <h2>TAREFAS DA SEMANA</h2>

    <div class="container-inputs">
        <label>
    <input type="checkbox"> 🧹 Limpar a cozinha
        </label>
    </div>

    <div class="container-inputs">
        <label>
            <input type="checkbox"> 🗑️ Recolher o lixo fora
        </label>
    </div>

    <div class="container-inputs">
        <label>
        <input type="checkbox"> 🧹 Varrer o pátio
        </label>
    </div>

    <div class="container-inputs">
        <label>
        <input type="checkbox"> 🚽 Lavar os banheiros
        </label>
    </div>



<div class="container-inputs">
        <label>
        <input type="checkbox"> 🍽️ Lavar a louça
        </label>
    </div>


<div class="container-inputs">
    <label>
<input type="checkbox">👗 Lavar roupa
    </label>
    </div>

<div class="container-inputs">
        <label>
        <input type="checkbox"> 🗂️ Organizar os armario
        </label>
    </div>


</div>
    
   
</div>

    <div id="painel-botoes">
        <button onclick="mostrarTodas()">Mostrar todas as pessoas</button>
        <button onclick="pesquisar()">🔍</button>
    </div>

    <div id="painel-pessoas"></div>

    <script src="script.js"></script>
</body>
</html>
